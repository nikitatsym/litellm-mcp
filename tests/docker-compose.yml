# Ephemeral LiteLLM proxy for integration smokes (tests/test_integration.py).
# Pinned to the prod tag; STORE_MODEL_IN_DB + a DATABASE_URL trigger the
# known-good Prisma-migration-on-start. No real provider keys anywhere.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: sk-test-master
      STORE_MODEL_IN_DB: "True"
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4010:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
