[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-mcp"
version = "0.1.0"
description = "MCP server for the LiteLLM proxy management API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2",
    "pydantic-settings>=2.0",
]
keywords = ["mcp", "litellm", "llm", "proxy", "model-context-protocol", "claude", "ai"]

[project.scripts]
litellm-mcp = "litellm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires a running LiteLLM instance"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
# Repo root on sys.path so tests can import the build-time `codegen` package.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F401/F541 mirror incus-mcp: intentional re-exports / lone fixture literals.
ignore = ["F401", "F541"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
